<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#avatarGrad)" />
  
  <!-- Subtle geometric accent rings -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6,4" />
  
  <!-- Stylized Monogram EA -->
  <text x="100" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#shadow)" letter-spacing="-1">EA</text>
  
  <!-- Subtle IT / Tech circuit dot indicator -->
  <circle cx="100" cy="155" r="4" fill="#38bdf8" />
  <line x1="85" y1="155" x2="94" y2="155" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="106" y1="155" x2="115" y2="155" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>
